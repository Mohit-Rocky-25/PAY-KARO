<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="PAY KARO — Pay Smart. Track Smart. Live Green. A next-generation UPI payment app with spending insights and carbon footprint tracking.">
  <meta name="theme-color" content="#0a0e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PAY KARO — Pay Smart. Track Smart. Live Green.</title>
  <link rel="stylesheet" href="index.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💸</text></svg>">
</head>
<body>

  <!-- ═══ App Shell ══════════════════════════════════════════════ -->
  <div id="app-shell">

    <!-- ─── HOME Page ─────────────────────────────────────────── -->
    <div id="page-home" class="page-view active">
      <!-- Rendered by JS -->
    </div>

    <!-- ─── INSIGHTS Page ─────────────────────────────────────── -->
    <div id="page-insights" class="page-view">
      <!-- Rendered by JS -->
    </div>

    <!-- ─── SPLIT Page ────────────────────────────────────────── -->
    <div id="page-split" class="page-view">
      <!-- Rendered by JS -->
    </div>

    <!-- ─── GREEN Page ────────────────────────────────────────── -->
    <div id="page-green" class="page-view">
      <!-- Rendered by JS -->
    </div>

    <!-- ═══ Bottom Navigation ════════════════════════════════════ -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-page="home" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-page="insights" aria-label="Insights">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 20V10"/>
          <path d="M12 20V4"/>
          <path d="M6 20v-6"/>
        </svg>
        <span>Insights</span>
      </button>
      <button class="nav-item" data-page="split" aria-label="Split">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 3h5v5"/>
          <path d="M8 3H3v5"/>
          <path d="M21 3l-8.5 8.5"/>
          <path d="M3 3l8.5 8.5"/>
          <path d="M3 21l8.5-8.5"/>
          <path d="M21 21l-8.5-8.5"/>
          <path d="M16 21h5v-5"/>
          <path d="M8 21H3v-5"/>
        </svg>
        <span>Split</span>
      </button>
      <button class="nav-item" data-page="green" aria-label="Green">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
          <path d="M7 13.5s2-2 5-2 5 2 5 2"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span>Green</span>
      </button>
    </nav>

    <!-- ═══ Send Money Modal ═════════════════════════════════════ -->
    <div class="modal-overlay" id="send-modal">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Send Money</div>
        <form id="send-form" autocomplete="off">
          <div class="form-group">
            <label class="form-label" for="send-upi">UPI ID</label>
            <input type="text" class="form-input" id="send-upi" placeholder="e.g. rahul@upi" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="send-amount">Amount</label>
            <div class="amount-input-wrap">
              <span class="amount-prefix">₹</span>
              <input type="number" class="form-input amount-input" id="send-amount" placeholder="0" min="1" max="100000" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="send-note">Note (optional)</label>
            <input type="text" class="form-input" id="send-note" placeholder="What's it for?" maxlength="50">
          </div>
          <div style="margin-top: var(--space-lg);">
            <button type="submit" class="btn-primary">Send Money</button>
          </div>
          <div style="margin-top: var(--space-sm);">
            <button type="button" class="btn-secondary" onclick="closeModal('send-modal')">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ═══ Create Split Modal ═══════════════════════════════════ -->
    <div class="modal-overlay" id="split-modal">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Create Split</div>
        <form id="split-form" autocomplete="off">
          <div class="form-group">
            <label class="form-label" for="split-title-input">Title</label>
            <input type="text" class="form-input" id="split-title-input" placeholder="e.g. Dinner at BBQ Nation" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="split-amount-input">Total Amount</label>
            <div class="amount-input-wrap">
              <span class="amount-prefix">₹</span>
              <input type="number" class="form-input amount-input" id="split-amount-input" placeholder="0" min="1" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="split-type-input">Split Type</label>
            <select class="form-select" id="split-type-input">
              <option value="equal">Equal split</option>
              <option value="custom">Custom amounts</option>
              <option value="percentage">By percentage</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Members</label>
            <div id="members-container">
              <div class="member-input-row" id="member-row-1">
                <input type="text" class="form-input member-name-input" placeholder="Name" required>
                <input type="text" class="form-input member-upi-input" placeholder="UPI ID" required>
              </div>
            </div>
            <button type="button" class="add-member-btn" onclick="addMemberRow()">+ Add Member</button>
          </div>
          <div style="margin-top: var(--space-sm);">
            <button type="submit" class="btn-primary">Create Split</button>
          </div>
          <div style="margin-top: var(--space-sm);">
            <button type="button" class="btn-secondary" onclick="closeModal('split-modal')">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ═══ Payment Success Overlay ══════════════════════════════ -->
    <div class="success-overlay" id="success-overlay">
      <!-- Rendered by JS -->
    </div>

  </div><!-- /app-shell -->

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <span class="toast-icon">✅</span>
    <span class="toast-message"></span>
  </div>

  <script src="app.js"></script>
</body>
</html>
